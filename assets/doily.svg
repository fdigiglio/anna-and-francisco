<svg xmlns="http://www.w3.org/2000/svg" viewBox="-100 -100 200 200" width="600" height="600">
  <title>Ivory lace heart doily</title>
  <defs>
    <path id="heart" pathLength="100" d="M-78-58C-102-20-58 28 0 82C58 28 102-20 78-58C52-96 0-78 0-48C0-78-52-96-78-58Z" />

    <pattern id="net" width="3.6" height="3.6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="3.6" height="3.6" fill="#fff" />
      <circle cx="1.8" cy="1.8" r="1.25" fill="#000" />
    </pattern>

    <mask id="lace" maskUnits="userSpaceOnUse" x="-100" y="-100" width="200" height="200">
      <rect x="-100" y="-100" width="200" height="200" fill="#fff" />

      <use href="#heart" fill="url(#net)" transform="scale(0.84)" />
      <use href="#heart" fill="#fff" transform="scale(0.66)" />
      <use href="#heart" fill="none" stroke="#fff" stroke-width="2" transform="scale(0.75)" />
      <use href="#heart" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-dasharray="1.6 2.4" transform="scale(0.75)" />
      <use href="#heart" fill="none" stroke="#000" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="1.6 2.4" transform="scale(0.75)" />

      <use href="#heart" fill="none" stroke="#000" stroke-width="4.6" stroke-linecap="round" stroke-dasharray="0 2.6" />
      <use href="#heart" fill="none" stroke="#000" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="0 1.3" transform="scale(0.91)" />
      <use href="#heart" fill="none" stroke="#000" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="0 2" transform="scale(0.61)" />
    </mask>

    <radialGradient id="cloth" gradientUnits="userSpaceOnUse" cx="0" cy="-5" r="100">
      <stop offset="0" stop-color="#f4ecda" />
      <stop offset="0.7" stop-color="#efe4cc" />
      <stop offset="1" stop-color="#e7dabd" />
    </radialGradient>

    <filter id="fabric" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" seed="5" result="noise" />
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.38  0 0 0 0 0.24  0 0 0 0.32 0" result="tint" />
      <feComposite in="tint" in2="SourceGraphic" operator="in" result="grain" />
      <feMerge result="textured">
        <feMergeNode in="SourceGraphic" />
        <feMergeNode in="grain" />
      </feMerge>
      <feDropShadow in="textured" dx="0.4" dy="1.4" stdDeviation="1.1" flood-color="#5a4728" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#fabric)">
    <g mask="url(#lace)">
      <use href="#heart" fill="url(#cloth)" />
      <use href="#heart" fill="none" stroke="url(#cloth)" stroke-width="14" stroke-linecap="round" stroke-dasharray="0 2.6" />
    </g>

    <g fill="none" stroke="#d3c3a0" stroke-width="0.7">
      <use href="#heart" stroke-opacity="0.5" />
      <use href="#heart" transform="scale(0.84)" stroke-width="0.8" />
      <use href="#heart" transform="scale(0.66)" stroke-width="1" />
      <use href="#heart" transform="scale(0.56)" stroke-width="1.2" stroke-dasharray="0.45 0.4" />
    </g>
  </g>
</svg>
