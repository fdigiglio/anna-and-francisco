<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" stitchTiles="stitch" result="noise" />
      <feDiffuseLighting in="noise" lighting-color="#ffffff" surfaceScale="0.55" diffuseConstant="1.02">
        <feDistantLight azimuth="60" elevation="78" />
      </feDiffuseLighting>
    </filter>
    <filter id="fibers" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.03 0.09" numOctaves="2" seed="11" stitchTiles="stitch" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.42  0 0 0 0 0.36  0 0 0 -0.25 0.14" />
    </filter>
  </defs>
  <rect width="320" height="320" filter="url(#grain)" />
</svg>
