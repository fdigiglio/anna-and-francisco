<svg xmlns="http://www.w3.org/2000/svg" viewBox="-62 -62 124 124" width="248" height="248">
  <title>Gold wax seal stamped A + F</title>
  <defs>
    <radialGradient id="wax" cx="36%" cy="30%" r="78%">
      <stop offset="0" stop-color="#ecd598" />
      <stop offset="0.3" stop-color="#cfa95a" />
      <stop offset="0.7" stop-color="#a5813c" />
      <stop offset="1" stop-color="#6c4f1d" />
    </radialGradient>
    <radialGradient id="well" cx="64%" cy="68%" r="82%">
      <stop offset="0" stop-color="#dcbd72" />
      <stop offset="0.55" stop-color="#b9944b" />
      <stop offset="1" stop-color="#86652b" />
    </radialGradient>
    <linearGradient id="relief" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3dc9c" />
      <stop offset="0.5" stop-color="#d2aa57" />
      <stop offset="1" stop-color="#a47b30" />
    </linearGradient>

    <filter id="wax3d" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.6" result="height" />
      <feSpecularLighting in="height" surfaceScale="6" specularConstant="0.85" specularExponent="20" lighting-color="#fff3cf" result="spec">
        <fePointLight x="-55" y="-75" z="95" />
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="specIn" />
      <feComposite in="SourceGraphic" in2="specIn" operator="arithmetic" k1="0" k2="1" k3="0.7" k4="0" result="lit" />
      <feTurbulence type="fractalNoise" baseFrequency="1.4" numOctaves="2" seed="3" result="noise" />
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.32  0 0 0 0 0.23  0 0 0 0 0.07  0 0 0 0.3 0" result="tint" />
      <feComposite in="tint" in2="SourceAlpha" operator="in" result="speckle" />
      <feMerge result="waxBody">
        <feMergeNode in="lit" />
        <feMergeNode in="speckle" />
      </feMerge>
      <feDropShadow in="waxBody" dx="1.4" dy="2.8" stdDeviation="2.2" flood-color="#3b2a0b" flood-opacity="0.5" />
    </filter>

    <path id="leaf" d="M-4.4 0Q0-2.6 4.4 0Q0 2.6-4.4 0Z" />
    <g id="branch">
      <path fill="none" stroke-width="0.9" d="M26.9 2.4A27 27 0 0 1 3.3 26.8" />
      <use href="#leaf" transform="rotate(96) translate(0 -29.2) rotate(-28)" />
      <use href="#leaf" transform="rotate(106) translate(0 -24.8) rotate(28)" />
      <use href="#leaf" transform="rotate(118) translate(0 -29.2) rotate(-28)" />
      <use href="#leaf" transform="rotate(128) translate(0 -24.8) rotate(28)" />
      <use href="#leaf" transform="rotate(140) translate(0 -29.2) rotate(-28)" />
      <use href="#leaf" transform="rotate(150) translate(0 -24.8) rotate(28)" />
      <use href="#leaf" transform="rotate(162) translate(0 -28.4) rotate(-22)" />
    </g>
    <g id="emblem">
      <use href="#branch" />
      <use href="#branch" transform="scale(-1 1)" />
      <circle cx="0" cy="27.2" r="1.6" />
      <circle cx="0" cy="-28.4" r="1.1" />
      <circle cx="-5" cy="-27.9" r="0.75" />
      <circle cx="5" cy="-27.9" r="0.75" />
      <text x="0" y="6.5" text-anchor="middle" font-family="Didot, 'Bodoni 72', 'Bodoni Moda', 'Playfair Display', 'Libre Baskerville', 'Times New Roman', Times, 'Liberation Serif', 'Nimbus Roman', serif" font-size="21" font-weight="600" letter-spacing="0.5" stroke-width="0.3">A<tspan font-size="13" dx="2.5" dy="-3">+</tspan><tspan dx="2.5" dy="3">F</tspan></text>
    </g>
  </defs>

  <g filter="url(#wax3d)">
    <path fill="url(#wax)" d="M1-50C14-53 25-48 33-40C43-37 51-26 50-13C55-3 53 12 47 22C46 34 36 44 23 47C13 54-3 53-14 49C-26 52-39 43-45 31C-53 23-53 6-49-6C-51-20-43-34-32-41C-23-50-11-48 1-50Z" />
    <ellipse fill="url(#wax)" cx="43" cy="35" rx="8" ry="6" transform="rotate(35 43 35)" />
    <ellipse fill="url(#wax)" cx="-49" cy="-18" rx="5.5" ry="4.2" transform="rotate(-20 -49 -18)" />
    <circle fill="url(#wax)" cx="-22" cy="49" r="4" />
  </g>

  <circle r="37.2" fill="none" stroke="#fae9b6" stroke-opacity="0.75" stroke-width="1.4" transform="translate(-0.7 -0.8)" />
  <circle r="37.2" fill="none" stroke="#6d4f17" stroke-opacity="0.45" stroke-width="1.2" transform="translate(0.8 1)" />
  <circle r="35" fill="url(#well)" />
  <circle r="34" fill="none" stroke="#6a4c16" stroke-opacity="0.55" stroke-width="1.8" transform="translate(0.8 1)" />
  <circle r="31.5" fill="none" stroke="#f3dc9c" stroke-opacity="0.5" stroke-width="0.6" stroke-dasharray="0.9 1.6" />

  <use href="#emblem" fill="#674a14" stroke="#674a14" stroke-width="0.3" opacity="0.6" transform="translate(0.8 0.95)" />
  <use href="#emblem" fill="#fcecbd" stroke="#fcecbd" stroke-width="0.3" opacity="0.85" transform="translate(-0.55 -0.65)" />
  <use href="#emblem" fill="url(#relief)" stroke="#c69d4b" stroke-width="0.3" />
</svg>
